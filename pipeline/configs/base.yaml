paths:
  work: work
  runs: work/runs     # run dirs; absolute allowed (Colab: shared Drive folder)
  datasets: datasets
  rwf_root: datasets/public/rwf2000/RWF-2000
  handoff: datasets/metadata/semester_split   # semester split metadata, read by the audit (pipeline/data/ingest.py)
cache:
  fps: 15
  short_side: 256
  jpeg_quality: 90
clip:
  T: 16
  crop: 224
  aug:
    scale: [0.6, 1.0]
    ratio: [0.75, 1.3333333333333333]
    hflip: 0.5
    color_jitter: [0.2, 0.2, 0.2, 0.02]   # brightness, contrast, saturation, hue
    grayscale: 0.1
split:
  val_frac: 0.15
  seed: 1337
  test_source: rwf_official_val
  drop_shared: true
  p4_fracs: [0.70, 0.15, 0.15]
train:
  lr: 0.0003
  weight_decay: 0.05
  label_smoothing: 0.1
  warmup_epochs: 2
  effective_batch: 32
  batch: null        # micro-batch; null = per-model DEFAULT_BATCH in train.py (accum = effective_batch / batch)
  pretrained: true
  device: auto       # auto = cuda if available; AMP is used only on cuda
  workers: 4
  deterministic: true
  max_epochs: 40
  keep_last: true    # false: delete last.pt once DONE is written (the grid sets false)
  patience: 6
  selection:
    metric: val_roc_auc
    mode: max
    tie_break: val_loss
  threshold_grid:
    start: 0.05
    stop: 0.95
    step: 0.01
  seeds: [0, 1, 2]
  headline_seeds: [0, 1, 2, 3, 4]
  headline_models: [M3, M4, M5]
  headline_protocols: [P2, P3]
eval:
  threshold_metric: f1
  bootstrap_resamples: 1000
  ece_bins: 15
bench:
  warmup_iters: 10
  iters: 50
  batch_sizes: [1]
